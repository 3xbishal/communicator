{% extends "base.html" %}
{% block title %}Request declined — Communicator{% endblock %}
{% block content %}
<div class="container">
  <div class="card landing-card shadow-sm">
    <div class="card-body p-4 p-md-5 text-center">
      <div class="icon-badge is-decline mx-auto mb-3"><i class="fa-solid fa-circle-xmark fa-lg"></i></div>
      <h1 class="h3 fw-bold mb-2">Request declined</h1>
      <p class="comment-text mb-4">Your username <strong>{{ request.member.username }}</strong> wasn't approved.</p>
      <form method="post" action="{% url 'identity:leave' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-brand btn-lg w-100">Register again</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
